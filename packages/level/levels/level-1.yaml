# Livello 1 del prototipo: cameretta → salone → camera dei genitori.
# Formato descritto in packages/level/README.md.

id: livello_1
title: La prima notte
intro: >-
  Ti svegli di soprassalto. La cameretta è buia, la casa scricchiola
  e la camera di mamma e papà sembra lontanissima.
start: cameretta
goal: camera_genitori
outro: >-
  Ti tuffi nel lettone, tra mamma e papà. Dalla porta, i fantasmi
  ti salutano con la mano. Buonanotte!

rooms:
  cameretta:
    name: Cameretta
    asset: room_cameretta
    description: >-
      La tua cameretta, ma di notte sembra un'altra: le ombre dei giocattoli
      si allungano sulle pareti.
    milestones:
      candela_accesa:
        description: La candela è accesa.
      peluche_scoperto:
        description: Hai scoperto il pipistrello di peluche sotto il letto.
        requires: [candela_accesa]
      chiave_trovata:
        description: Hai trovato la chiave della porta.
        requires: [peluche_scoperto]
      porta_aperta:
        description: La porta della cameretta è aperta.
        requires: [chiave_trovata]
    exits:
      salone:
        description: La porta della cameretta, che dà sul salone.
        requires: [porta_aperta]
        locked: La porta è chiusa a chiave.
    objects:
      comodino:
        name: Comodino
        asset: object_comodino
        description: Il comodino accanto al letto, con un cassetto.
        states:
          chiuso: Il cassetto è chiuso.
          aperto: Il cassetto è aperto.
        actions:
          apri:
            description: Aprire il cassetto.
            outcomes:
              - if: { state: { comodino: aperto } }
                text: Il cassetto è già aperto.
              - text: Apri il cassetto e trovi un mozzicone di candela. Peccato che sia spento.
                effects:
                  - set_state: { comodino: aperto }
                  - reveal: candela
      candela:
        name: Mozzicone di candela
        asset: item_candela
        description: Una candela consumata nel cassetto del comodino, ancora buona per fare un po' di luce.
        hidden: true
      zucca:
        name: Zucca senza sorriso
        asset: object_zucca
        description: 'Una zucca-lanterna sul comodino. Una scritta dice: "Ho occhi e bocca, ma senza luce non posso sorridere".'
        states:
          vuota: La zucca è vuota e spenta.
          candela_inserita: Dentro la zucca c'è una candela spenta.
          accesa: Una fiamma azzurra proietta sotto il letto l'ombra di un pipistrello.
        actions:
          inserisci_candela:
            description: Inserire la candela nella zucca.
            outcomes:
              - if: { not: { state: { zucca: vuota } } }
                text: La candela è già nella zucca.
              - if: { state: { comodino: aperto } }
                text: Inserisci la candela nella zucca. Ora serve una scintilla magica.
                effects:
                  - hide: candela
                  - set_state: { zucca: candela_inserita }
              - text: Devi prima trovare una candela.
      cestino:
        name: Cestino dei giocattoli
        asset: object_cestino
        description: Un cestino pieno di giocattoli e dolcetti di stoffa.
        states:
          pieno: Tra i giocattoli spunta una caramella finta.
          vuoto: Non ci sono altri dolcetti di stoffa.
        actions:
          cerca:
            outcomes:
              - if: { state: { cestino: vuoto } }
                text: Non trovi altre caramelle finte.
              - text: Scopri una caramella finta di stoffa sul bordo del cestino.
                effects:
                  - reveal: caramella_finta
                  - set_state: { cestino: vuoto }
      caramella_finta:
        name: Caramella finta
        asset: item_caramella_finta
        description: Una caramella di stoffa sul bordo del cestino, perfetta per un giocattolo goloso.
        hidden: true
      letto:
        name: Letto
        asset: object_letto
        description: Il tuo letto, con le coperte tutte arruffate.
        actions:
          guarda_sotto:
            description: Guardare sotto il letto.
            outcomes:
              - if: { completed: peluche_scoperto }
                text: Sotto il letto c'è il pipistrello di peluche che hai già scoperto.
              - text: Alla luce della zucca scopri un pipistrello di peluche che custodisce una chiave!
                effects:
                  - reveal: pipistrello_peluche
                  - complete: peluche_scoperto
              - text: È troppo buio per vedere qualcosa là sotto.
      pipistrello_peluche:
        name: Pipistrello di peluche
        asset: object_pipistrello_peluche
        description: 'Custodisce la chiave. Il cartellino dice: "Dolcetto o scherzetto? Con un dolcetto lascio il lucchetto!".'
        hidden: true
        actions:
          offri_caramella:
            description: Offrire la caramella finta al peluche.
            outcomes:
              - if: { completed: chiave_trovata }
                text: Il pipistrello è sazio e ha già lasciato la chiave.
              - if: { state: { cestino: vuoto } }
                text: Il pipistrello raggiunge il dolcetto di stoffa e lascia cadere la chiave accanto alla porta.
                effects:
                  - hide: caramella_finta
                  - reveal: chiave
                  - complete: chiave_trovata
              - text: Il peluche aspetta un dolcetto per giocattoli.
      chiave:
        name: Chiave di ferro
        asset: item_chiave
        description: Una chiave pesante e fredda accanto alla porta, con un fiocco rosso legato all'anello.
        hidden: true
      porta:
        name: Porta
        asset: object_porta_cameretta
        description: La porta della cameretta.
        states:
          chiusa: È chiusa a chiave.
          aperta: È aperta sul salone buio.
        actions:
          apri:
            outcomes:
              - if: { state: { porta: aperta } }
                text: La porta è già aperta.
              - if: { completed: chiave_trovata }
                text: La chiave gira con un clic e la porta si apre cigolando.
                effects:
                  - set_state: { porta: aperta }
                  - hide: chiave
                  - complete: porta_aperta
              - text: La maniglia non si muove. Serve una chiave.
    ghosts:
      conte_sbadiglio:
        name: Conte Sbadiglio
        asset: ghost_conte_sbadiglio
        description: Un fantasma in vestaglia e berretto da notte, che fluttua abbracciato al cuscino.
        personality: >-
          Nobile gentile e sempre assonnato. Parla lentamente, dà del voi al bambino
          e interrompe le frasi con sbadigli. Accende le candele con uno sbadiglio magico
          che genera una fiamma azzurra innocua. Aiuta volentieri, poi vorrebbe tornare a dormire.
        knowledge:
          - text: Nel cassetto del comodino c'è un mozzicone di candela.
          - text: La candela va inserita nella zucca sul comodino; lui può accenderla con uno sbadiglio magico.
          - if: { completed: candela_accesa }
            text: L'ombra del pipistrello indica di guardare sotto il letto.
        actions:
          chiedi_luce:
            description: Chiedere al Conte Sbadiglio di accendere la candela.
            outcomes:
              - if: { completed: candela_accesa }
                text: '"La vostra candela brilla già, signorino."'
              - if: { state: { zucca: candela_inserita } }
                text: >-
                  Il Conte sbadiglia e una fiammella azzurra che non scotta accende la candela
                  nella zucca. Sul pavimento, sotto il letto, appare l'ombra di un pipistrello.
                effects:
                  - set_state: { zucca: accesa }
                  - complete: candela_accesa
              - text: '"Mettete una candela nella zucca, poi ci penserò io... dopo questo sbadiglio."'
      pip:
        name: Pip
        asset: ghost_pip
        description: Un fantasmino dispettoso, piccolo come un cuscino, che fa le capriole a mezz'aria.
        personality: >-
          Bambino fantasma dispettoso e giocherellone. Risponde con indovinelli e prese in giro,
          ma in fondo vuole aiutare. Non ammette mai di aver combinato un guaio, al massimo
          lo lascia intuire.
        knowledge:
          - text: Nel cestino ci sono dolcetti di stoffa per i giocattoli.
          - if: { completed: peluche_scoperto }
            text: Il pipistrello mangia solo dolci per giocattoli; quelli veri gli fanno male alle cuciture.

  salone:
    name: Salone
    asset: room_salone
    description: >-
      Un salone enorme, con un pianoforte a coda, una libreria che arriva al soffitto
      e un grande arazzo appeso alla parete di fondo. Accanto allo specchio, un tavolino
      espone tre ritratti del maggiordomo Ernesto.
    milestones:
      spartito_trovato:
        description: Hai trovato lo spartito della ninna nanna.
      ninna_nanna_suonata:
        description: Hai suonato la ninna nanna e la porta dietro l'arazzo si è svegliata.
        requires: [spartito_trovato]
    exits:
      cameretta:
        description: La porta della tua cameretta.
      camera_genitori:
        description: Una porta nascosta dietro l'arazzo.
        requires: [ninna_nanna_suonata]
        locked: Dietro l'arazzo c'è una porta, ma sembra addormentata e non si apre.
    objects:
      libreria:
        name: Libreria
        asset: object_libreria
        description: Scaffali pieni di libri polverosi e fogli sparsi.
        actions:
          cerca:
            description: Cercare tra libri e fogli.
            outcomes:
              - text: Trovi solo libri polverosi. Nessuno spartito tra queste pagine.
      specchio:
        name: Specchio del salone
        asset: object_specchio
        description: Riflette il bambino e il salone, ma Ernesto non compare. I fantasmi non hanno riflesso!
      tavolino:
        name: Tavolino dei ritratti
        asset: object_tavolino
        description: Tre ritratti mostrano Ernesto con il papillon inclinato a sinistra, a destra o perfettamente dritto.
        states:
          nessuno: Non hai ancora indicato un ritratto.
          sinistra: Hai indicato il ritratto con il papillon inclinato a sinistra.
          destra: Hai indicato il ritratto con il papillon inclinato a destra.
          dritto: Hai indicato il ritratto con il papillon dritto.
        actions:
          scegli_sinistra:
            description: Indicare il ritratto con il papillon inclinato a sinistra.
            outcomes:
              - if: { completed: spartito_trovato }
                text: Ernesto ha già sistemato il papillon.
              - text: Indichi sul tavolino il ritratto con il papillon inclinato a sinistra.
                effects:
                  - set_state: { tavolino: sinistra }
          scegli_destra:
            description: Indicare il ritratto con il papillon inclinato a destra.
            outcomes:
              - if: { completed: spartito_trovato }
                text: Ernesto ha già sistemato il papillon.
              - text: Indichi sul tavolino il ritratto con il papillon inclinato a destra.
                effects:
                  - set_state: { tavolino: destra }
          scegli_dritto:
            description: Indicare il ritratto con il papillon dritto.
            outcomes:
              - if: { completed: spartito_trovato }
                text: Ernesto ha già sistemato il papillon.
              - text: Indichi sul tavolino il ritratto con il papillon dritto.
                effects:
                  - set_state: { tavolino: dritto }
      ritratto_sinistra:
        name: Ritratto con papillon a sinistra
        asset: item_ritratto_sinistra
        description: Sul tavolino, Ernesto con il papillon inclinato a sinistra; le estremità sono ad altezze diverse.
      ritratto_destra:
        name: Ritratto con papillon a destra
        asset: item_ritratto_destra
        description: Sul tavolino, Ernesto con il papillon inclinato a destra; le estremità sono ad altezze diverse.
      ritratto_dritto:
        name: Ritratto con papillon dritto
        asset: item_ritratto_dritto
        description: Sul tavolino, Ernesto con il papillon perfettamente dritto e le estremità alla stessa altezza.
      spartito:
        name: Spartito
        asset: item_spartito
        description: 'Sul pianoforte, una ninna nanna illustrata: da sinistra a destra, zucca, fantasma, pipistrello. Il titolo dice "Per la porta che dorme".'
        hidden: true
      pianoforte:
        name: Pianoforte
        asset: object_pianoforte
        description: Un pianoforte nero con tre tasti contrassegnati da zucca, fantasma e pipistrello.
        states:
          inizio: Nessuna sequenza in corso.
          zucca_premuta: Hai suonato il primo simbolo, la zucca.
          fantasma_premuto: Hai suonato zucca e fantasma.
          completato: La ninna nanna ha svegliato la porta.
        actions:
          premi_zucca:
            description: Premere il tasto con la zucca.
            outcomes:
              - if: { completed: ninna_nanna_suonata }
                text: La porta è già sveglia. Ofelia sorride.
              - if: { not: { completed: spartito_trovato } }
                text: Senza spartito non sai quale melodia suonare.
              - if: { state: { pianoforte: inizio } }
                text: Suoni la zucca. Ofelia annuisce.
                effects:
                  - set_state: { pianoforte: zucca_premuta }
              - text: Nota sbagliata! La melodia ricomincia da capo.
                effects:
                  - set_state: { pianoforte: inizio }
          premi_fantasma:
            description: Premere il tasto con il fantasma.
            outcomes:
              - if: { completed: ninna_nanna_suonata }
                text: La porta è già sveglia. Ofelia sorride.
              - if: { not: { completed: spartito_trovato } }
                text: Senza spartito non sai quale melodia suonare.
              - if: { state: { pianoforte: zucca_premuta } }
                text: Suoni il fantasma. Ofelia comincia a cantare.
                effects:
                  - set_state: { pianoforte: fantasma_premuto }
              - text: Nota sbagliata! La melodia ricomincia da capo.
                effects:
                  - set_state: { pianoforte: inizio }
          premi_pipistrello:
            description: Premere il tasto con il pipistrello.
            outcomes:
              - if: { completed: ninna_nanna_suonata }
                text: La porta è già sveglia. Ofelia sorride.
              - if: { not: { completed: spartito_trovato } }
                text: Senza spartito non sai quale melodia suonare.
              - if: { state: { pianoforte: fantasma_premuto } }
                text: >-
                  Suoni il pipistrello e completi la ninna nanna. Ofelia canta con te
                  e dietro l'arazzo una serratura sbadiglia e si apre.
                effects:
                  - set_state: { pianoforte: completato }
                  - complete: ninna_nanna_suonata
              - text: Nota sbagliata! La melodia ricomincia da capo.
                effects:
                  - set_state: { pianoforte: inizio }
      arazzo:
        name: Arazzo
        asset: object_arazzo
        description: Un arazzo che raffigura un castello sotto la luna.
        actions:
          sposta:
            description: Guardare dietro l'arazzo.
            outcomes:
              - if: { completed: ninna_nanna_suonata }
                text: Dietro l'arazzo la porta è socchiusa.
              - text: Dietro l'arazzo c'è una porta senza maniglia e senza serratura.
    ghosts:
      ernesto:
        name: Ernesto
        asset: ghost_ernesto
        description: Un maggiordomo fantasma con i guanti bianchi, il naso all'insù e un grande papillon.
        personality: >-
          Maggiordomo formale e pignolo, un po' snob ma leale alla famiglia. Odia il disordine
          e sospira spesso. Parla per frasi brevi e corrette.
        knowledge:
          - if: { not: { completed: spartito_trovato } }
            text: Ha il papillon storto e non ha riflesso. Chiede di indicare il ritratto con il papillon in ordine come modello e promette di svelare uno spartito.
          - if: { not: { completed: spartito_trovato } }
            text: Le due estremità del papillon devono stare alla stessa altezza. I tre ritratti sono sul tavolino.
          - text: La porta dietro l'arazzo porta alla camera dei padroni di casa.
        actions:
          mostra_ritratto:
            description: Mostrare a Ernesto il ritratto indicato sul tavolino.
            outcomes:
              - if: { completed: spartito_trovato }
                text: '"Il papillon è a posto e lo spartito è sul pianoforte. Grazie!"'
              - if: { state: { tavolino: dritto } }
                text: Ernesto guarda il ritratto sul tavolino, sistema il papillon e posa lo spartito sul pianoforte.
                effects:
                  - reveal: spartito
                  - complete: spartito_trovato
              - if: { any: [{ state: { tavolino: sinistra } }, { state: { tavolino: destra } }] }
                text: '"Ma qui è storto quanto il mio!" Puoi indicare un altro ritratto sul tavolino.'
              - text: '"Indicate un ritratto sul tavolino e mostratemelo, per cortesia."'
      ofelia:
        name: Ofelia
        asset: ghost_ofelia
        description: Una cantante lirica fantasma, con un vestito di piume e la voce tremula.
        personality: >-
          Cantante lirica drammatica ed esagerata. Trasforma ogni frase in un piccolo
          melodramma e a volte canticchia invece di rispondere.
        knowledge:
          - text: La porta dietro l'arazzo dorme e si sveglia solo sentendo la sua ninna nanna.
          - if: { completed: spartito_trovato }
            text: I simboli dello spartito vanno suonati da sinistra a destra sui tasti del pianoforte; lei canterà. Una nota sbagliata azzera la sequenza.

  camera_genitori:
    name: Camera dei genitori
    asset: room_camera_genitori
    description: La camera di mamma e papà. Il lettone è caldo e sicuro.
    exits:
      salone:
        description: La porta nascosta che dà sul salone.
    ghosts:
      nonno_fosco:
        name: Nonno Fosco
        asset: ghost_nonno_fosco
        description: Un vecchio fantasma con la barba lunga fino ai piedi, seduto su una poltrona a dondolo.
        personality: >-
          Bisnonno affettuoso e brontolone. Racconta storie lunghissime di quando era vivo
          e si addormenta a metà.
        knowledge:
          - text: Ha vegliato sulla famiglia per cent'anni ed è fiero del bambino.
      bisnonna_adelina:
        name: Bisnonna Adelina
        asset: ghost_bisnonna_adelina
        description: Una fantasma minuta che sferruzza una sciarpa infinita.
        personality: >-
          Bisnonna dolce e pratica. Dà consigli su tutto e chiede sempre se il bambino ha
          mangiato abbastanza.
        knowledge:
          - text: I fantasmi della casa hanno aiutato il bambino perché gli vogliono bene.
