<!doctype html>
<!-- Pagina provvisoria, finché non c'è il frontend: mostra lo stato e permette di chiamare i tool a mano. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BadNight</title>
  <style>
    body { background: #111; color: #ddd; font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; }
    h1 { color: #f90; }
    pre { background: #1c1c1c; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
    input, button { font: inherit; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1 id="title">BadNight</h1>
  <p id="intro"></p>
  <form id="call">
    <input id="cmd" placeholder="look | examine letto | act letto guarda_sotto | move salone | talk pip" size="50" autofocus>
    <button>Invia</button>
    <button type="button" id="reset">Nuova partita</button>
  </form>
  <h2>Stanza</h2>
  <pre id="view"></pre>
  <h2>Eventi</h2>
  <pre id="events"></pre>
  <script>
    const params = { examine: ['target'], act: ['target', 'action'], move: ['to'], talk: ['ghost'] };
    const $ = (id) => document.getElementById(id);
    let run = 0, seq = 0;

    // Polling: legge solo gli eventi nuovi (anche quelli generati dall'agente).
    async function refresh() {
      const s = await (await fetch(`/api/state?since=${seq}`)).json();
      if (s.run !== run) { run = s.run; seq = 0; $('events').textContent = ''; return refresh(); }
      $('title').textContent = s.level.title;
      $('intro').textContent = s.won ? s.level.outro : s.level.intro;
      $('view').textContent = JSON.stringify({ ...s.view, completed: s.completed }, null, 2);
      for (const e of s.events) {
        $('events').textContent = `#${e.seq} [${e.source}] ${e.tool} ${JSON.stringify(e.args)}\n${JSON.stringify(e.result, null, 2)}\n\n` + $('events').textContent;
      }
      seq = s.seq;
    }

    $('call').onsubmit = async (ev) => {
      ev.preventDefault();
      const [tool, ...rest] = $('cmd').value.trim().split(/\s+/);
      if (!tool) return;
      const args = Object.fromEntries((params[tool] ?? []).map((p, i) => [p, rest[i]]));
      await fetch(`/api/tools/${tool}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(args) });
      $('cmd').value = '';
      refresh();
    };
    $('reset').onclick = async () => { await fetch('/api/reset', { method: 'POST' }); refresh(); };

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
